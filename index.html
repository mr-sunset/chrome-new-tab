<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Search</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <p aria-label="Search">
            <span class="letter" id="s">S</span>
            <span class="letter" id="e">e</span>
            <span class="letter" id="a">a</span>
            <span class="letter" id="r">r</span>
            <span class="letter" id="c">c</span>
            <span class="letter" id="h">h</span>
        </p>

        <nav>
            <a href="https://youtube.com/">
                <img src="product-icons/youtube.svg" id="youtube" alt="YouTube" draggable="false">
            </a>

            <a href="https://mail.google.com/">
                <img src="product-icons/gmail.svg" alt="Gmail" draggable="false">
            </a>

            <a href="https://gemini.google.com/">
                <img src="product-icons/gemini.svg" alt="Gemini" draggable="false">
            </a>

            <a href="https://docs.google.com/">
                <img src="product-icons/docs.svg" alt="Docs" draggable="false">
            </a>

            <a href="https://slides.google.com/">
                <img src="product-icons/slides.svg" alt="Slides" draggable="false">
            </a>

            <a href="https://sheets.google.com/">
                <img src="product-icons/sheets.svg" alt="Sheets" draggable="false">
            </a>
        </nav>

        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" id="query" placeholder="Search" autocomplete="off">
        </form>
    </body>
</html>
